apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        infrastructure: fargate
    spec:
      serviceAccountName: frontend
      containers:
        - name: frontend
          image: 203156341699.dkr.ecr.us-east-1.amazonaws.com/app1:frontend-v1
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        infrastructure: fargate
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: 203156341699.dkr.ecr.us-east-1.amazonaws.com/app1:backend-v1
          env:
            - name: DB_AUTH_MODE
              value: iam
            - name: DB_HOST
              value: app1-dev-postgres.cpwsqbojybld.us-east-1.rds.amazonaws.com
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: app1
            - name: DB_USER
              value: app1_backend
            - name: AWS_REGION
              value: us-east-1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
